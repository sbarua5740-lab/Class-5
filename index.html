<title>বৃত্তি পরীক্ষা ২০২৬ – MCQ অনুশীলন (সেট ৩ – চ্যালেঞ্জ ১২০)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --bg:#f3f6fb; --card:#ffffff; --ink:#1d2433; --muted:#5b6578; --line:#d9e0ec;
  --brand:#1f5fbf; --brand-soft:#e6efff;
  --ok:#157a3d; --ok-bg:#e3f6ea; --bad:#b42318; --bad-bg:#fde8e6;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"SutonnyMJ","Noto Sans Bengali","Kalpurush","SolaimanLipi","Siyam Rupali","Nirmala UI",Vrinda,sans-serif;
  font-size:17px; line-height:1.65;
}
header{background:var(--brand); color:#fff; padding:18px 14px 14px; text-align:center}
header h1{margin:0; font-size:21px; font-weight:700}
header p{margin:4px 0 0; font-size:14px; opacity:.9}
.wrap{max-width:820px; margin:0 auto; padding:0 12px 60px}
.tabs{display:flex; gap:8px; overflow-x:auto; padding:12px 2px; -webkit-overflow-scrolling:touch}
.tab{
  flex:0 0 auto; border:1.5px solid var(--line); background:#fff; color:var(--ink);
  padding:7px 14px; border-radius:999px; font:inherit; font-size:15px; cursor:pointer; white-space:nowrap;
}
.tab.active{background:var(--brand); border-color:var(--brand); color:#fff; font-weight:600}
.bar{
  position:sticky; top:0; z-index:5; background:var(--card); border:1px solid var(--line);
  border-radius:12px; padding:10px 14px; margin:4px 0 14px; box-shadow:0 2px 8px rgba(20,40,80,.07);
}
.stats{display:flex; flex-wrap:wrap; gap:6px 16px; font-size:15px; justify-content:space-between}
.stats b{font-weight:700}
.ok-t{color:var(--ok)} .bad-t{color:var(--bad)}
.prog{height:7px; background:var(--line); border-radius:9px; margin-top:8px; overflow:hidden}
.prog>i{display:block; height:100%; width:0; background:var(--brand); transition:width .25s}
.q{
  background:var(--card); border:1px solid var(--line); border-radius:14px;
  padding:14px 14px 12px; margin-bottom:14px;
}
.q .meta{font-size:13px; color:var(--muted); margin-bottom:4px}
.q .text{font-weight:600; margin-bottom:10px}
.q .text span.n{color:var(--brand); margin-right:4px}
.opt{
  display:flex; gap:10px; align-items:flex-start; width:100%; text-align:left;
  border:1.5px solid var(--line); background:#fff; color:var(--ink);
  border-radius:10px; padding:9px 12px; margin:7px 0; font:inherit; cursor:pointer;
}
.opt:hover:not(:disabled){border-color:var(--brand); background:var(--brand-soft)}
.opt .lab{
  flex:0 0 28px; height:28px; border-radius:50%; background:var(--brand-soft); color:var(--brand);
  display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:700; margin-top:1px;
}
.opt:disabled{cursor:default}
.opt.correct{background:var(--ok-bg); border-color:var(--ok); color:#0e5a2b}
.opt.correct .lab{background:var(--ok); color:#fff}
.opt.wrong{background:var(--bad-bg); border-color:var(--bad); color:#7a160d}
.opt.wrong .lab{background:var(--bad); color:#fff}
.fb{margin-top:8px; padding:9px 12px; border-radius:10px; font-size:15.5px; display:none}
.fb.show{display:block}
.fb.good{background:var(--ok-bg); color:#0e5a2b}
.fb.err{background:var(--bad-bg); color:#7a160d}
.fb .ex{display:block; margin-top:3px; color:var(--muted); font-size:14.5px}
.result{
  background:var(--card); border:2px solid var(--brand); border-radius:14px; padding:18px; text-align:center;
  margin:8px 0 18px; display:none;
}
.result.show{display:block}
.result .big{font-size:34px; font-weight:700; color:var(--brand)}
.btns{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:10px}
.btn{
  border:0; background:var(--brand); color:#fff; padding:9px 18px; border-radius:10px;
  font:inherit; font-size:15.5px; cursor:pointer;
}
.btn.alt{background:#fff; color:var(--brand); border:1.5px solid var(--brand)}
footer{text-align:center; color:var(--muted); font-size:13.5px; padding:6px 10px 30px}
</style>
</head>

["bn","ব্যাকরণ · ক্রিয়ার কাজ","‘ভাবিতে ভাবিতে চিন্তার রেখা দেখা দিলো তাঁর ভালে।’—এ চরণের সঠিক চলিত গদ্যরূপ কোনটি?",["ভাবতে ভাবতে তাঁর কপালে চিন্তার রেখা দেখা দিল।","ভাবিয়া ভাবিয়া তাঁর কপালে চিন্তা দেখা গেল।","ভাবছে ভাবছে তাঁর ভালে চিন্তা এল।","ভাবিতে ভাবিতে তাঁর কপালে রেখা পড়ল।"],"‘ভাবিতে’ = ভাবতে, ‘ভালে’ = কপালে, ‘দিলো’ = দিল।"],

["bn","ব্যাকরণ · যুক্তবর্ণ বিভাজন","‘উজ্জ্বল’ শব্দটির যুক্তবর্ণ ভাঙলে কোনটি পাওয়া যায়?",["জ + জ + ব","জ + ব","জ + ঞ + ব","দ + জ + ব"],"‘জ্জ্ব’ = জ + জ + ব।"],
["bn","ব্যাকরণ · সমার্থক শব্দ","নিচের কোনটি ‘পানি’ শব্দের সমার্থক নয়?",["অনল","বারি","জল","নীর"],"বারি, জল, নীর—সবই পানি; অনল অর্থ আগুন।"],
["bn","ব্যাকরণ · সমার্থক শব্দ","নিচের কোন শব্দজোড়াটি সমার্থক?",["গুরু – শিক্ষক","পুত্র – কন্যা","দিন – রাত","আলো – আঁধার"],"পাঠের শব্দার্থ অনুযায়ী গুরু অর্থ শিক্ষক।"],

/* ===== English Grammar 15 ===== */
["en","Grammar · Parts of Speech","In which sentence is the word ‘fast’ used as an ADVERB?",["The cheetah runs fast.","He is a fast runner.","This is a fast car.","The fast train has arrived."],"In ‘runs fast’, the word tells how the cheetah runs, so it is an adverb. In the others it describes a noun."],
["en","Grammar · Article","Choose the sentence with correct articles.",["He is an honest boy and a European tourist.","He is a honest boy and an European tourist.","He is an honest boy and an European tourist.","He is a honest boy and a European tourist."],"‘Honest’ starts with a vowel sound (silent h) → an. ‘European’ starts with a ‘yu’ sound → a."],
["en","Grammar · Article","Rina is ______ tallest girl in ______ class.",["the, the","a, the","the, a","an, a"],"A superlative takes ‘the’, and a particular class also takes ‘the’."],
["en","Grammar · Parts of Speech","The boy lost ______ pen, so I gave ______ mine.",["his, him","him, his","he, his","his, he"],"‘His’ is a possessive adjective before ‘pen’; ‘him’ is the object of ‘gave’."],
["en","Grammar · Tense","She ______ her homework just now. (finish)",["finished","has finished","finishes","is finishing"],"‘Just now’ points to a definite moment in the past, so we use the Simple Past."],
["en","Grammar · Tense","Choose the sentence in the Simple Past tense.",["They visited their grandmother last year.","They visit their grandmother every year.","They are visiting their grandmother.","They will visit their grandmother soon."],"‘Visited’ with ‘last year’ is the Simple Past."],
["en","Grammar · Tense","Choose the correct sentence.",["Each of the boys has a book.","Each of the boys have a book.","Each of the boys are having a book.","Each of the boys were a book."],"‘Each’ is singular, so it takes ‘has’."],
["en","Grammar · Tense","Rahim ______ (go) to school every day, but today he ______ at home.",["goes, is staying","went, stays","goes, stayed","is going, stay"],"A daily habit uses the Present Simple; ‘today’ with an action in progress uses the Present Continuous."],
["en","Grammar · Preposition","The boy hid ______ the tree and waited ______ his friend.",["behind, for","at, to","on, at","in, with"],"We say ‘hid behind’ and ‘waited for’."],
["en","Grammar · Preposition","She has been absent ______ Monday.",["since","for","from","by"],"‘Since’ is used with a starting point in time."],
["en","Grammar · Preposition","He is good ______ mathematics but weak ______ English.",["at, in","in, at","on, to","of, for"],"We say ‘good at’ and ‘weak in’."],
["en","Grammar · Preposition","He sat ______ the two girls.",["between","among","on","with"],"‘Between’ is used for two people or things."],
["en","Grammar · Comparison of Adjectives","Choose the correct sentence.",["Of all the animals, the cheetah is the fastest.","Of all the animals, the cheetah is faster.","Of all the animals, the cheetah is more fast.","Of all the animals, the cheetah is most fast."],"Among three or more, we use ‘the + -est’ for a one-syllable adjective."],
["en","Grammar · Comparison of Adjectives","Dhaka is ______ than Khulna. (crowded)",["more crowded","crowdeder","most crowded","more crowd"],"Adjectives with more than one syllable usually take ‘more’ for comparison of two."],
["en","Grammar · Wh-questions","“______ did the boy sleep when he was tired?” — “In her shade.”",["Where","When","Who","Why"],"The answer ‘in her shade’ tells the place, so we ask with ‘Where’."],

["mind","মানসিক দক্ষতা · যুক্তি","রহিম করিমের চেয়ে লম্বা এবং সুমি রহিমের চেয়ে লম্বা। তিনজনের মধ্যে সবচেয়ে ছোটো (খাটো) কে?",["করিম","রহিম","সুমি","বলা সম্ভব নয়"],"সুমি > রহিম > করিম; তাই করিম সবচেয়ে খাটো।"]
];

const SUBJECTS = [
  {key:"all",  name:"সব বিষয়"},
  {key:"bn",   name:"বাংলা"},
  {key:"en",   name:"English"},
  {key:"math", name:"গণিত"},
  {key:"sci",  name:"বিজ্ঞান"},
  {key:"mind", name:"মানসিক দক্ষতা"}
];

/* ---------- সহায়ক ফাংশন ---------- */
const BN = "০১২৩৪৫৬৭৮৯";
const bn = n => String(n).replace(/\d/g, d => BN[d]);
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const LABELS_BN = ["ক","খ","গ","ঘ"];
const LABELS_EN = ["A","B","C","D"];

/* ---------- অবস্থা ---------- */
let QS = [];            // প্রশ্ন + এলোমেলো অপশন
let answered = {};      // id -> বাছাই করা অপশনের index
let current = "all";

function buildQuestions(){
  QS = RAW.map((r,i) => ({
    id:i, s:r[0], c:r[1], q:r[2], correct:r[3][0], opts:shuffle(r[3]), e:r[4]
  }));
}

function list(){ return QS.filter(q => current==="all" || q.s===current); }

/* ---------- রেন্ডার ---------- */
function renderTabs(){
  const el = document.getElementById("tabs");
  el.innerHTML = "";
  SUBJECTS.forEach(s => {
    const n = QS.filter(q => s.key==="all" || q.s===s.key).length;
    const b = document.createElement("button");
    b.className = "tab" + (s.key===current ? " active" : "");
    b.textContent = s.name + " (" + bn(n) + ")";
    b.onclick = () => { current = s.key; render(); window.scrollTo({top:0}); };
    el.appendChild(b);
  });
}

function renderList(){
  const box = document.getElementById("list");
  box.innerHTML = "";
  list().forEach((q, idx) => {
    const labs = q.s==="en" ? LABELS_EN : LABELS_BN;
    const card = document.createElement("div");
    card.className = "q";
    card.id = "q"+q.id;

    const meta = document.createElement("div");
    meta.className = "meta"; meta.textContent = q.c;
    const t = document.createElement("div");
    t.className = "text";
    const n = document.createElement("span"); n.className="n"; n.textContent = bn(idx+1)+".";
    t.appendChild(n); t.appendChild(document.createTextNode(" "+q.q));
    card.appendChild(meta); card.appendChild(t);

    q.opts.forEach((o, oi) => {
      const b = document.createElement("button");
      b.className = "opt"; b.type = "button";
      b.innerHTML = '<span class="lab">'+labs[oi]+'</span><span class="otx"></span>';
      b.querySelector(".otx").textContent = o;
      b.onclick = () => choose(q.id, oi);
      card.appendChild(b);
    });

    const fb = document.createElement("div");
    fb.className = "fb"; fb.id = "fb"+q.id;
    card.appendChild(fb);
    box.appendChild(card);

    if (answered[q.id] !== undefined) paint(q, answered[q.id]);
  });
}

function paint(q, chosen){
  const card = document.getElementById("q"+q.id);
  const btns = card.querySelectorAll(".opt");
  const fb = document.getElementById("fb"+q.id);
  btns.forEach((b,i) => {
    b.disabled = true;
    if (q.opts[i] === q.correct) b.classList.add("correct");
    else if (i === chosen) b.classList.add("wrong");
  });
  const ok = q.opts[chosen] === q.correct;
  fb.className = "fb show " + (ok ? "good" : "err");
  fb.innerHTML = "";
  const head = document.createElement("b");
  head.textContent = ok ? "✔ সঠিক উত্তর!" : "✘ ভুল হয়েছে। সঠিক উত্তর: " + q.correct;
  fb.appendChild(head);
  if (q.e){ const ex = document.createElement("span"); ex.className="ex"; ex.textContent = q.e; fb.appendChild(ex); }
}

function choose(id, oi){
  if (answered[id] !== undefined) return;
  answered[id] = oi;
  paint(QS[id], oi);
  stats();
}

function stats(){
  const L = list();
  let a=0, ok=0;
  L.forEach(q => { if (answered[q.id] !== undefined){ a++; if (q.opts[answered[q.id]]===q.correct) ok++; } });
  document.getElementById("sAns").textContent = bn(a);
  document.getElementById("sTot").textContent = bn(L.length);
  document.getElementById("sOk").textContent = bn(ok);
  document.getElementById("sBad").textContent = bn(a-ok);
  document.getElementById("prog").style.width = (L.length ? a/L.length*100 : 0) + "%";

  const r = document.getElementById("result");
  if (L.length && a===L.length){
    const pct = Math.round(ok/L.length*100);
    document.getElementById("rScore").textContent = bn(ok)+" / "+bn(L.length)+"  ("+bn(pct)+"%)";
    document.getElementById("rMsg").textContent =
      pct>=90 ? "অসাধারণ! চমৎকার প্রস্তুতি।" :
      pct>=75 ? "খুব ভালো! আরেকটু অনুশীলন করলেই পারফেক্ট।" :
      pct>=50 ? "ভালো চেষ্টা! ভুলগুলো আবার দেখে নাও।" :
                "হতাশ হয়ো না—বইয়ের অধ্যায়গুলো আবার পড়ে চেষ্টা করো।";
    r.classList.add("show");
  } else r.classList.remove("show");
}

function render(){ renderTabs(); renderList(); stats(); }

function resetCurrent(){
  list().forEach(q => { delete answered[q.id]; });
  // শুধু এই অংশের অপশন নতুন করে এলোমেলো করা
  list().forEach(q => { q.opts = shuffle(q.opts); });
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

document.getElementById("btnReset").onclick = resetCurrent;
document.getElementById("btnRetry").onclick = resetCurrent;
document.getElementById("btnTop").onclick = () => window.scrollTo({top:0, behavior:"smooth"});

buildQuestions();
render();
</script>
